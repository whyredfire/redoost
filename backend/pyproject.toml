[project]
name = "redoost"
version = "0.1.7"
description = "Self-hosted static-site publishing with FastAPI, React, Garage, and Nginx"
readme = "README.md"
authors = [
    { name = "Karan Parashar", email = "whyredfire@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aioboto3>=15.5.0",
    "aiohttp>=3.14.3",
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "coolname>=5.0.0",
    "fastapi>=0.142.2",
    "greenlet>=3.5.6",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "sqlmodel>=0.0.47",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.40.1",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.uv]
package = false

[tool.pyright]
typeCheckingMode = "standard"

[tool.alembic]
script_location = "%(here)s/migrations"
prepend_sys_path = ["."]

[[tool.alembic.post_write_hooks]]
name = "ruff_format"
type = "module"
module = "ruff"
options = "format REVISION_SCRIPT_FILENAME"

[[tool.alembic.post_write_hooks]]
name = "ruff_check"
type = "module"
module = "ruff"
options = "check --fix REVISION_SCRIPT_FILENAME"
