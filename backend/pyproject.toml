[project]
name = "redoost"
version = "0.5.1"
description = "Self-hosted static-site publishing with FastAPI, React, Garage, and Nginx"
readme = "README.md"
authors = [
    { name = "Karan Parashar", email = "whyredfire@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aioboto3>=15.5.0",
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "coolname>=5.0.0",
    "fastapi>=0.162.0",
    "greenlet>=3.5.6",
    "httpx2>=2.16.0",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.15.1",
    "sqlmodel>=0.0.48",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.uv]
package = false

[tool.pyright]
typeCheckingMode = "standard"

[tool.alembic]
script_location = "%(here)s/migrations"
prepend_sys_path = ["."]

[[tool.alembic.post_write_hooks]]
name = "ruff_format"
type = "module"
module = "ruff"
options = "format REVISION_SCRIPT_FILENAME"

[[tool.alembic.post_write_hooks]]
name = "ruff_check"
type = "module"
module = "ruff"
options = "check --fix REVISION_SCRIPT_FILENAME"
