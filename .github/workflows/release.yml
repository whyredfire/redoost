name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 0.1.1
        required: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-slim
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - run: '[[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Version must look like 1.2.3"; exit 1; }'

  build:
    needs: check
    strategy:
      matrix:
        include:
          - image: redoost-api
            context: backend
          - image: redoost-frontend
            context: frontend
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      context: ${{ matrix.context }}
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      cache: true
      cache-scope: ${{ matrix.image }}
      build-args: VERSION=${{ inputs.version }}
      sbom: true
      set-meta-labels: true
      set-meta-annotations: true
      meta-images: ghcr.io/whyredfire/${{ matrix.image }}
      meta-tags: |
        type=raw,value=${{ inputs.version }}
        type=raw,value=latest
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.2.0

      - name: Set the version
        run: |
          # Update version in chart/Chart.yaml
          yq -i '.version = strenv(VERSION) | .appVersion = strenv(VERSION)' chart/Chart.yaml

          # Update version in backend/pyproject.toml
          (cd backend && uv version "$VERSION" --no-sync)

          # Update version in frontend/package.json
          yq -i '.version = strenv(VERSION)' frontend/package.json

      # yq drops blank lines, so only its changes are applied, as a patch
      # https://stackoverflow.com/questions/57627243/how-to-prevent-yq-removing-comments-and-empty-lines#comment115811480_57938189
      - name: Point the chart at the release images
        run: |
          yq '.api.image.tag = strenv(VERSION) | .frontend.image.tag = strenv(VERSION)' chart/values.yaml |
            diff -B chart/values.yaml - | patch chart/values.yaml

      # Commit subjects since the previous release, without automated commits
      - name: Write the changelog
        run: |
          previous=$(git describe --tags --abbrev=0 2>/dev/null || true)
          {
            echo "## Changes"
            echo
            git log --no-merges --pretty='- %s (%h)' ${previous:+"$previous..HEAD"} |
              grep -vE '^- chore(\(chart\))?: (Update image tags|Release v)' || true
            if [ -n "$previous" ]; then
              echo
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${previous}...v${VERSION}"
            fi
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Commit, tag, and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: Release v${VERSION}"
          git tag "v${VERSION}"
          git push origin HEAD "v${VERSION}"
          gh release create "v${VERSION}" --title "v${VERSION}" --notes-file "$RUNNER_TEMP/notes.md"
