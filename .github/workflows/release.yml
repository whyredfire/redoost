name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 0.1.1
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0

      - name: Set the version
        run: |
          # Validate version format
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Version must look like 1.2.3"; exit 1; }

          # Update version in chart/Chart.yaml
          yq -i '.version = strenv(VERSION) | .appVersion = strenv(VERSION)' chart/Chart.yaml

          # Update version in backend/pyproject.toml
          (cd backend && uv version "$VERSION" --no-sync)

          # Update version in frontend/package.json
          yq -i '.version = strenv(VERSION)' frontend/package.json

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # The chart already points at the images built from the latest code
      - name: Tag the images
        run: |
          sha=$(yq '.api.image.tag' chart/values.yaml)
          for image in redoost-api redoost-frontend; do
            docker buildx imagetools create -t "ghcr.io/whyredfire/${image}:${VERSION}" "ghcr.io/whyredfire/${image}:${sha}"
          done

      - name: Commit, tag, and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: Release v${VERSION}"
          git tag "v${VERSION}"
          git push origin HEAD "v${VERSION}"
          gh release create "v${VERSION}" --title "v${VERSION}" --generate-notes
