name: build

on:
  push:
    branches:
      - main
    paths:
      - backend/**
      - frontend/**
      - .github/workflows/build.yml
      - "!**/*.md"
      - "!backend/tests/**"
  # Only the checks run on pull requests; images are built from main
  pull_request:
    paths:
      - backend/**
      - frontend/**
      - .github/workflows/build.yml
      - "!**/*.md"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-slim
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run basedpyright src scripts tests migrations
      - run: uv run python -m pytest

  backend-postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: redoost
          POSTGRES_PASSWORD: redoost
          POSTGRES_DB: redoost
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U redoost"
          --health-interval 2s
          --health-retries 15
    env:
      REDOOST_TEST_DATABASE_URL: postgresql+asyncpg://redoost:redoost@localhost:5432/redoost
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run python -m pytest

  frontend:
    runs-on: ubuntu-slim
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun run build

  version:
    if: github.event_name == 'push'
    runs-on: ubuntu-slim
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: version
        run: |
          release=$(git describe --tags --abbrev=0 --match 'v[0-9]*')
          echo "version=${release#v}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  build:
    needs: [backend, backend-postgres, frontend, version]
    if: github.event_name == 'push'
    strategy:
      matrix:
        include:
          - image: redoost-api
            context: backend
          - image: redoost-frontend
            context: frontend
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      context: ${{ matrix.context }}
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      cache: true
      cache-scope: ${{ matrix.image }}
      build-args: VERSION=${{ needs.version.outputs.version }}
      sbom: true
      set-meta-labels: true
      set-meta-annotations: true
      meta-images: ghcr.io/whyredfire/${{ matrix.image }}
      meta-tags: |
        type=raw,value=${{ needs.version.outputs.version }}
        type=raw,value=latest
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
