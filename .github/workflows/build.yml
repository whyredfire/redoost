name: build

on:
  push:
    branches:
      - main
    paths:
      - backend/**
      - frontend/**
      - .github/workflows/build.yml
      - "!**/*.md"
  # Images are only built by the release workflow
  pull_request:
    paths:
      - backend/**
      - frontend/**
      - .github/workflows/build.yml
      - "!**/*.md"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-slim
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run basedpyright src scripts tests migrations
      - run: uv run python -m pytest

  backend-postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: redoost
          POSTGRES_PASSWORD: redoost
          POSTGRES_DB: redoost
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U redoost"
          --health-interval 2s
          --health-retries 15
    env:
      REDOOST_TEST_DATABASE_URL: postgresql+asyncpg://redoost:redoost@localhost:5432/redoost
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run python -m pytest

  frontend:
    runs-on: ubuntu-slim
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun run build
