name: build

on:
  push:
    branches:
      - main
    paths:
      - backend/**
      - frontend/**
      - .github/workflows/build.yml
      - "!**/*.md"
      - "!backend/tests/**"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-slim
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run basedpyright src scripts tests migrations
      - run: uv run python -m pytest

  frontend:
    runs-on: ubuntu-slim
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun run build

  build:
    needs: [backend, frontend]
    strategy:
      matrix:
        include:
          - image: redoost-api
            context: backend
          - image: redoost-frontend
            context: frontend
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      context: ${{ matrix.context }}
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      cache: true
      cache-scope: ${{ matrix.image }}
      # Links the packages to this repository on GHCR
      set-meta-labels: true
      set-meta-annotations: true
      meta-images: ghcr.io/whyredfire/${{ matrix.image }}
      meta-tags: |
        type=sha
        type=raw,value=latest
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  update-chart:
    needs: build
    runs-on: ubuntu-slim
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Point the chart at the new images
        run: |
          export TAG="sha-${GITHUB_SHA::7}"
          # yq drops blank lines, so only its changes are applied, as a patch
          # https://stackoverflow.com/questions/57627243/how-to-prevent-yq-removing-comments-and-empty-lines#comment115811480_57938189
          yq '.api.image.tag = strenv(TAG) | .frontend.image.tag = strenv(TAG)' chart/values.yaml |
            diff -B chart/values.yaml - | patch chart/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(chart): Update image tags to ${TAG}"
          git pull --rebase
          git push
