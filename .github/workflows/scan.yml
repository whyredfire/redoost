name: scan

on:
  # After each image build, and weekly for CVEs published since
  workflow_run:
    workflows: [build]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-slim
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        image: [redoost-api, redoost-frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.74.0
          image-ref: ghcr.io/whyredfire/${{ matrix.image }}:latest
          ignore-unfixed: true
          format: sarif
          output: trivy.sarif
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: ${{ matrix.image }}
