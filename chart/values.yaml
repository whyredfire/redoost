nameOverride: ""
fullnameOverride: ""

# Old ReplicaSets kept per deployment, for rollbacks
revisionHistoryLimit: 3

# Where browsers reach the dashboard and the published sites. Sites are served
# at <slug>.<sites host>, which needs a wildcard DNS record and certificate.
appOrigin: https://redoost.example.com
sitesOrigin: https://sites.example.com

# The two routes can attach to different listeners, since sites usually have
# their own domain and certificate
httpRoute:
  annotations: {}
  app:
    parentRefs:
      - name: gateway
        sectionName: https
    # Services to route to instead of the API and frontend, e.g. proxies ({name, port})
    apiBackendRef: {}
    frontendBackendRef: {}
  sites:
    parentRefs:
      - name: gateway
        sectionName: https

# An existing Garage bucket; the setup Job enables its website endpoint and CORS
s3:
  endpoint: http://garage.garage.svc.cluster.local:3900
  # Browsers upload here directly
  publicEndpoint: https://s3.example.com
  # Garage's website endpoint (host:port), used by the sites Nginx
  websiteUpstream: garage.garage.svc.cluster.local:3902
  region: garage
  bucket: redoost-sites
  accessKeyId: ""
  secretAccessKey: ""
  # Secret with REDOOST_S3_ACCESS_KEY_ID and REDOOST_S3_SECRET_ACCESS_KEY,
  # used instead of the two values above
  existingSecret: ""

api:
  image:
    repository: ghcr.io/whyredfire/redoost-api
    tag: sha-8a7e8b9
    pullPolicy: Always
  replicas: 1
  logLevel: INFO
  maxFileSize: 10MiB
  maxDeploymentSize: 50MiB
  maxDeploymentFiles: 500
  uploadWindow: PT1H
  persistence:
    size: 100Mi
    storageClass: ""
  resources:
    requests:
      cpu: 10m
      memory: 96Mi
    limits:
      cpu: 500m
      memory: 256Mi

frontend:
  image:
    repository: ghcr.io/whyredfire/redoost-frontend
    tag: sha-8a7e8b9
    pullPolicy: Always
  replicas: 1
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 250m
      memory: 64Mi

sites:
  image:
    repository: nginxinc/nginx-unprivileged
    tag: 1.31.6-alpine-slim@sha256:123fb7283ffb4788e260d4e980005a978995fefedcdbb04d268077a19b84576d
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 500m
      memory: 128Mi
