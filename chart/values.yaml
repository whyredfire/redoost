nameOverride: ""
fullnameOverride: ""

# Old ReplicaSets kept per deployment, for rollbacks
revisionHistoryLimit: 3

# Where browsers reach the dashboard and the published sites. Sites are served
# at <slug>.<sites host>, which needs a wildcard DNS record and certificate.
appOrigin: https://redoost.example.com
sitesOrigin: https://sites.example.com

# The two routes can attach to different listeners, since sites usually have
# their own domain and certificate
httpRoute:
  annotations: {}
  app:
    parentRefs:
      - name: gateway
        sectionName: https
    # Services to route to instead of the API and frontend, e.g. proxies ({name, port})
    apiBackendRef: {}
    frontendBackendRef: {}
  sites:
    parentRefs:
      - name: gateway
        sectionName: https

# An existing Garage bucket; the setup Job enables its website endpoint and CORS
s3:
  endpoint: http://garage.garage.svc.cluster.local:3900
  # Browsers upload here directly
  publicEndpoint: https://s3.example.com
  # Garage's website endpoint (host:port), used by the sites Nginx
  websiteUpstream: garage.garage.svc.cluster.local:3902
  region: garage
  bucket: redoost-sites
  accessKeyId: ""
  secretAccessKey: ""
  # Secret with REDOOST_S3_ACCESS_KEY_ID and REDOOST_S3_SECRET_ACCESS_KEY,
  # used instead of the two values above
  existingSecret: ""

auth:
  # Signs the API's tokens, e.g. from openssl rand -hex 32
  jwtSecret: ""
  # Sign-in with an OIDC provider, which replaces anonymous publishing. Register
  # <appOrigin>/auth/callback as its redirect URI.
  oidc:
    issuer: ""
    # Shown on the sign-in button; only google for now
    provider: google
    clientId: ""
    clientSecret: ""
  # Secret with REDOOST_JWT_SECRET and, with sign-in, REDOOST_OIDC_CLIENT_SECRET,
  # used instead of the secrets above
  existingSecret: ""

# Postgres database, e.g. postgresql+asyncpg://user:password@host:5432/redoost.
# When neither value is set, the API uses SQLite on a volume.
database:
  url: ""
  # Secret with REDOOST_DATABASE_URL, used instead of the url above
  existingSecret: ""

api:
  image:
    repository: ghcr.io/whyredfire/redoost-api
    tag: 0.2.0
    pullPolicy: Always
  replicas: 1
  logLevel: INFO
  maxFileSize: 10MiB
  maxDeploymentSize: 50MiB
  maxDeploymentFiles: 500
  # Total size of each user's sites
  maxAccountSize: 1GiB
  uploadWindow: PT1H
  # Anonymous sites stay online this long after their first publish, and each
  # anonymous user can have this many at once; sites of signed-in users have neither
  anonymousSiteLifetime: P7D
  anonymousSiteLimit: 5
  persistence:
    size: 100Mi
    storageClass: ""
  resources:
    requests:
      cpu: 10m
      memory: 96Mi
    limits:
      cpu: 500m
      memory: 256Mi

frontend:
  image:
    repository: ghcr.io/whyredfire/redoost-frontend
    tag: 0.2.0
    pullPolicy: Always
  replicas: 1
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 250m
      memory: 64Mi

sites:
  image:
    repository: nginxinc/nginx-unprivileged
    tag: 1.31.6-alpine-slim@sha256:c81a27f28bc2d9c2da8998444e653c7b85b9bbbaa92e44ef18d8920784e06507
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 500m
      memory: 128Mi

# Removes unfinished uploads past their window, and files left without a site
cleanup:
  schedule: "@daily"
  # Finished runs kept, to check their logs
  successfulJobsHistoryLimit: 10
  failedJobsHistoryLimit: 10

# Limits pod traffic to what the chart needs; off by default because the
# gateway and S3 selectors depend on the cluster
networkPolicy:
  enabled: false
  # NetworkPolicy peers allowed to reach the dashboard, API, and sites
  gateway:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: gateway
  # NetworkPolicy peers running S3 (Garage); ports come from the s3 values
  s3:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: garage
  # NetworkPolicy peers the API reaches the OIDC issuer at, on the port from
  # auth.oidc.issuer; empty allows any destination, as public providers need
  oidc: []
  # NetworkPolicy peers running Postgres; the port comes from database.url, or 5432
  database:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: postgres
