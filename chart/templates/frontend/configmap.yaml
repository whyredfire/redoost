apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "redoost.fullname" . }}-frontend
  labels:
    {{- include "redoost.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
data:
  default.conf: |
    server {
        listen 8080;
        root /usr/share/nginx/html;

        # Inline scripts stay allowed for the theme script, which must run before
        # first paint; blob: workers are how fflate unzips in the background
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' {{ (urlParse .Values.s3.publicEndpoint).scheme }}://{{ (urlParse .Values.s3.publicEndpoint).host }}; worker-src 'self' blob:; frame-src {{ (urlParse .Values.sitesOrigin).scheme }}://*.{{ (urlParse .Values.sitesOrigin).host }}; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;

        # Link preview scrapers need an absolute image URL
        sub_filter 'content="/og.png"' 'content="{{ trimSuffix "/" .Values.appOrigin }}/og.png"';

        location = /config.json {
            default_type application/json;
            return 200 '{{ dict "sitesOrigin" .Values.sitesOrigin | toJson }}';
        }

        # Assets have hashed names, but the page pointing at them must stay fresh
        location = /index.html {
            add_header_inherit merge;
            add_header Cache-Control "no-cache";
        }

        location / {
            try_files $uri /index.html;
        }
    }
