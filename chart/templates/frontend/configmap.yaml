apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "redoost.fullname" . }}-frontend
  labels:
    {{- include "redoost.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
data:
  default.conf: |
    server {
        listen 8080;
        root /usr/share/nginx/html;

        location = /config.json {
            default_type application/json;
            return 200 '{{ dict "sitesOrigin" .Values.sitesOrigin | toJson }}';
        }

        # Assets have hashed names, but the page pointing at them must stay fresh
        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        location / {
            try_files $uri /index.html;
        }
    }
