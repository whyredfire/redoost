apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "redoost.fullname" . }}-frontend
  labels:
    {{- include "redoost.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "redoost.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/frontend/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "redoost.labels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      securityContext:
        {{- include "redoost.podSecurityContext" . | nindent 8 }}
      containers:
        - name: frontend
          image: {{ include "redoost.image" (dict "image" .Values.frontend.image "context" $) }}
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          securityContext:
            {{- include "redoost.securityContext" . | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d
            # Nginx keeps its pid and temporary files here
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ include "redoost.fullname" . }}-frontend
        - name: tmp
          emptyDir: {}
