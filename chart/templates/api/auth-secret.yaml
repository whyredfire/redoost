{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "redoost.authSecretName" . }}
  labels:
    {{- include "redoost.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
type: Opaque
stringData:
  REDOOST_JWT_SECRET: {{ required "Set auth.jwtSecret or auth.existingSecret" .Values.auth.jwtSecret | quote }}
  {{- if .Values.auth.oidc.issuer }}
  REDOOST_OIDC_CLIENT_SECRET: {{ required "Set auth.oidc.clientSecret or auth.existingSecret" .Values.auth.oidc.clientSecret | quote }}
  {{- end }}
{{- end }}
