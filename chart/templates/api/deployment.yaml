apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "redoost.fullname" . }}-api
  labels:
    {{- include "redoost.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  {{- if not (include "redoost.postgres" .) }}
  # SQLite can't be shared, so the old pod stops before the new one starts
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "redoost.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/api/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/api/secret.yaml") . | sha256sum }}
        checksum/auth-secret: {{ include (print $.Template.BasePath "/api/auth-secret.yaml") . | sha256sum }}
        {{- if include "redoost.postgres" . }}
        checksum/database-secret: {{ include (print $.Template.BasePath "/api/database-secret.yaml") . | sha256sum }}
        {{- end }}
      labels:
        {{- include "redoost.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      securityContext:
        {{- include "redoost.podSecurityContext" . | nindent 8 }}
        {{- if not (include "redoost.postgres" .) }}
        # Lets the image's non-root user write to the SQLite volume
        fsGroup: 65532
      affinity:
        {{- include "redoost.apiAffinity" . | nindent 8 }}
        {{- end }}
      initContainers:
        - name: migrate
          image: {{ include "redoost.image" (dict "image" .Values.api.image "context" $) }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          command: ["python", "-m", "alembic", "upgrade", "head"]
          envFrom:
            {{- include "redoost.apiEnvFrom" . | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- include "redoost.securityContext" . | nindent 12 }}
          {{- if not (include "redoost.postgres" .) }}
          volumeMounts:
            - name: data
              mountPath: /app/data
          {{- end }}
      containers:
        - name: api
          image: {{ include "redoost.image" (dict "image" .Values.api.image "context" $) }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          envFrom:
            {{- include "redoost.apiEnvFrom" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
          # Readiness includes the database and S3; liveness only the process
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            tcpSocket:
              port: http
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- include "redoost.securityContext" . | nindent 12 }}
          {{- if not (include "redoost.postgres" .) }}
          volumeMounts:
            - name: data
              mountPath: /app/data
          {{- end }}
      {{- if not (include "redoost.postgres" .) }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "redoost.fullname" . }}-api-data
      {{- end }}
