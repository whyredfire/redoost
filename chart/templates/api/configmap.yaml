apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "redoost.fullname" . }}-api
  labels:
    {{- include "redoost.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
data:
  REDOOST_LOG_LEVEL: {{ .Values.api.logLevel | quote }}
  {{- if not (include "redoost.postgres" .) }}
  REDOOST_DATABASE_URL: sqlite+aiosqlite:////app/data/redoost.db
  {{- end }}
  REDOOST_APP_ORIGIN: {{ .Values.appOrigin | quote }}
  REDOOST_S3_ENDPOINT: {{ .Values.s3.endpoint | quote }}
  REDOOST_S3_PUBLIC_ENDPOINT: {{ .Values.s3.publicEndpoint | quote }}
  REDOOST_S3_REGION: {{ .Values.s3.region | quote }}
  REDOOST_S3_BUCKET: {{ .Values.s3.bucket | quote }}
  REDOOST_MAX_FILE_SIZE: {{ .Values.api.maxFileSize | quote }}
  REDOOST_MAX_DEPLOYMENT_SIZE: {{ .Values.api.maxDeploymentSize | quote }}
  REDOOST_MAX_DEPLOYMENT_FILES: {{ .Values.api.maxDeploymentFiles | quote }}
  REDOOST_MAX_ACCOUNT_SIZE: {{ .Values.api.maxAccountSize | quote }}
  REDOOST_UPLOAD_WINDOW: {{ .Values.api.uploadWindow | quote }}
  REDOOST_OIDC_ISSUER: {{ required "Set auth.oidc.issuer" .Values.auth.oidc.issuer | quote }}
  REDOOST_OIDC_PROVIDER: {{ .Values.auth.oidc.provider | quote }}
  REDOOST_OIDC_CLIENT_ID: {{ required "Set auth.oidc.clientId" .Values.auth.oidc.clientId | quote }}
