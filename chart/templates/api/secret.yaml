{{- if not .Values.s3.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "redoost.secretName" . }}
  labels:
    {{- include "redoost.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
type: Opaque
stringData:
  REDOOST_S3_ACCESS_KEY_ID: {{ required "Set s3.accessKeyId or s3.existingSecret" .Values.s3.accessKeyId | quote }}
  REDOOST_S3_SECRET_ACCESS_KEY: {{ required "Set s3.secretAccessKey or s3.existingSecret" .Values.s3.secretAccessKey | quote }}
{{- end }}
