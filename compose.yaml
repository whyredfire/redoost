name: redoost

services:
  garage:
    image: dxflrs/garage:v2.5.0@sha256:677e5b758e4425a325b811c425c026bf35a4bf42f7ddbaa773de3f4fd779a5a5
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_DEFAULT_ACCESS_KEY}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_DEFAULT_SECRET_KEY}
      GARAGE_DEFAULT_BUCKET: ${GARAGE_DEFAULT_BUCKET}
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage-data:/var/lib/garage
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 3s
      retries: 12

  garage-ui:
    image: noooste/garage-ui:v0.14.0@sha256:e4a33c448304a3f6e60f08d6aa71b2471fd79ac870a5c7e178ea247dea3238b3
    depends_on:
      garage:
        condition: service_healthy
    environment:
      GARAGE_UI_GARAGE_ENDPOINT: http://garage:3900
      GARAGE_UI_GARAGE_ADMIN_ENDPOINT: http://garage:3903
      GARAGE_UI_GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
      GARAGE_UI_GARAGE_REGION: ${REDOOST_S3_REGION}
      GARAGE_UI_AUTH_TOKEN_ENABLED: "true"
      GARAGE_UI_SERVER_HOST: 0.0.0.0
    ports:
      - "8080:8080"

  postgres:
    image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    environment:
      POSTGRES_USER: redoost
      POSTGRES_PASSWORD: redoost
      POSTGRES_DB: redoost
    configs:
      # The tests' own database, which they empty on every run
      - source: test-database
        target: /docker-entrypoint-initdb.d/test-database.sql
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "redoost", "-d", "redoost"]
      interval: 2s
      timeout: 3s
      retries: 15

  init:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: ["uv", "run", "--no-sync", "python", "-m", "scripts.setup_bucket"]
    env_file: .env
    environment:
      REDOOST_DATABASE_URL: postgresql+asyncpg://redoost:redoost@postgres/redoost
    depends_on:
      garage:
        condition: service_healthy

  # Stands in for an init container on the API pod
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
    env_file: .env
    environment:
      REDOOST_DATABASE_URL: postgresql+asyncpg://redoost:redoost@postgres/redoost
    depends_on:
      postgres:
        condition: service_healthy
    develop:
      watch:
        - action: rebuild
          path: ./backend/migrations

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file: .env
    environment:
      REDOOST_DATABASE_URL: postgresql+asyncpg://redoost:redoost@postgres/redoost
      REDOOST_TEST_DATABASE_URL: postgresql+asyncpg://redoost:redoost@postgres/redoost_test
      REDOOST_RELOAD: "true"
    depends_on:
      init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    develop:
      watch:
        - action: sync
          path: ./backend/src
          target: /app/src
        - action: sync
          path: ./backend/tests
          target: /app/tests
        - action: sync
          path: ./backend/scripts
          target: /app/scripts
        - action: rebuild
          path: ./backend/uv.lock

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      REDOOST_SITES_ORIGIN: http://${REDOOST_SITES_DOMAIN}:8081
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src
        - action: sync
          path: ./frontend/styles
          target: /app/styles
        - action: sync
          path: ./frontend/public
          target: /app/public
        - action: sync
          path: ./frontend/index.html
          target: /app/index.html
        - action: sync
          path: ./frontend/vite.config.ts
          target: /app/vite.config.ts
        - action: rebuild
          path: ./frontend/bun.lock

  sites:
    image: nginx:1.31.8-alpine-slim@sha256:f45171d36c76a8b2f5ef97108a3a8a2294248a6578a0a180edc2d78f7d2edc26
    depends_on:
      garage:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      REDOOST_S3_BUCKET: ${REDOOST_S3_BUCKET}
      REDOOST_SITES_DOMAIN: ${REDOOST_SITES_DOMAIN}
      REDOOST_API_UPSTREAM: ${REDOOST_API_UPSTREAM}
      REDOOST_S3_WEBSITE_UPSTREAM: ${REDOOST_S3_WEBSITE_UPSTREAM}
    volumes:
      - ./sites.conf:/etc/nginx/templates/default.conf.template:ro

  gateway:
    image: nginx:1.31.8-alpine-slim@sha256:f45171d36c76a8b2f5ef97108a3a8a2294248a6578a0a180edc2d78f7d2edc26
    depends_on:
      - api
      - frontend
      - sites
    environment:
      REDOOST_SITES_DOMAIN: ${REDOOST_SITES_DOMAIN}
    ports:
      - "8081:80"
    volumes:
      - ./gateway.conf:/etc/nginx/templates/default.conf.template:ro

volumes:
  garage-data:
  postgres-data:

configs:
  test-database:
    content: CREATE DATABASE redoost_test;
