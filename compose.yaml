name: redoost

services:
  garage:
    image: dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_DEFAULT_ACCESS_KEY}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_DEFAULT_SECRET_KEY}
      GARAGE_DEFAULT_BUCKET: ${GARAGE_DEFAULT_BUCKET}
    ports:
      - "3900:3900"
      - "3902:3902"
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 3s
      retries: 12

  garage-ui:
    image: noooste/garage-ui:v0.13.0@sha256:a1444fa10585a0efc8ce3c33ebda873e5714d51dbc8f7f49d00143ff3b72fcc2
    depends_on:
      garage:
        condition: service_healthy
    environment:
      GARAGE_UI_GARAGE_ENDPOINT: http://garage:3900
      GARAGE_UI_GARAGE_ADMIN_ENDPOINT: http://garage:3903
      GARAGE_UI_GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
      GARAGE_UI_GARAGE_REGION: ${REDOOST_S3_REGION}
      GARAGE_UI_AUTH_TOKEN_ENABLED: "true"
      GARAGE_UI_SERVER_HOST: 0.0.0.0
    ports:
      - "8080:8080"

  nginx:
    image: nginx:1.31.6-alpine-slim@sha256:b54a1a3219e4b8b90fd4d5d383af7f8843a7b34a8079897cb83487a6a3e1aff3
    depends_on:
      garage:
        condition: service_healthy
    environment:
      REDOOST_S3_BUCKET: ${REDOOST_S3_BUCKET}
      REDOOST_SITES_DOMAIN: ${REDOOST_SITES_DOMAIN}
      REDOOST_API_UPSTREAM: ${REDOOST_API_UPSTREAM}
      REDOOST_S3_WEBSITE_UPSTREAM: ${REDOOST_S3_WEBSITE_UPSTREAM}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8081:80"
    volumes:
      - ./nginx.conf:/etc/nginx/templates/default.conf.template:ro

volumes:
  garage-meta:
  garage-data:
