name: redoost

services:
  garage:
    image: dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_DEFAULT_ACCESS_KEY}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_DEFAULT_SECRET_KEY}
      GARAGE_DEFAULT_BUCKET: ${GARAGE_DEFAULT_BUCKET}
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 3s
      retries: 12

  garage-ui:
    image: noooste/garage-ui:v0.13.0@sha256:a1444fa10585a0efc8ce3c33ebda873e5714d51dbc8f7f49d00143ff3b72fcc2
    depends_on:
      garage:
        condition: service_healthy
    environment:
      GARAGE_UI_GARAGE_ENDPOINT: http://garage:3900
      GARAGE_UI_GARAGE_ADMIN_ENDPOINT: http://garage:3903
      GARAGE_UI_GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
      GARAGE_UI_GARAGE_REGION: ${REDOOST_S3_REGION}
      GARAGE_UI_AUTH_TOKEN_ENABLED: "true"
      GARAGE_UI_SERVER_HOST: 0.0.0.0
    ports:
      - "8080:8080"

  init:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: ["uv", "run", "--no-sync", "python", "-m", "scripts.setup_bucket"]
    env_file: .env
    depends_on:
      garage:
        condition: service_healthy

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file: .env
    environment:
      REDOOST_DATABASE_URL: sqlite+aiosqlite:///./data/redoost.db
      REDOOST_RELOAD: "true"
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - api-data:/app/data
    develop:
      watch:
        - action: sync
          path: ./backend/src
          target: /app/src
        - action: sync
          path: ./backend/tests
          target: /app/tests
        - action: rebuild
          path: ./backend/uv.lock

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      BUN_PUBLIC_SITES_ORIGIN: http://${REDOOST_SITES_DOMAIN}:8081
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src
        - action: sync
          path: ./frontend/styles
          target: /app/styles
        - action: rebuild
          path: ./frontend/bun.lock

  sites:
    image: nginx:1.31.6-alpine-slim@sha256:b54a1a3219e4b8b90fd4d5d383af7f8843a7b34a8079897cb83487a6a3e1aff3
    depends_on:
      garage:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      REDOOST_S3_BUCKET: ${REDOOST_S3_BUCKET}
      REDOOST_SITES_DOMAIN: ${REDOOST_SITES_DOMAIN}
      REDOOST_API_UPSTREAM: ${REDOOST_API_UPSTREAM}
      REDOOST_S3_WEBSITE_UPSTREAM: ${REDOOST_S3_WEBSITE_UPSTREAM}
    volumes:
      - ./sites.conf:/etc/nginx/templates/default.conf.template:ro

  gateway:
    image: nginx:1.31.6-alpine-slim@sha256:b54a1a3219e4b8b90fd4d5d383af7f8843a7b34a8079897cb83487a6a3e1aff3
    depends_on:
      - api
      - frontend
      - sites
    environment:
      REDOOST_SITES_DOMAIN: ${REDOOST_SITES_DOMAIN}
    ports:
      - "8081:80"
    volumes:
      - ./gateway.conf:/etc/nginx/templates/default.conf.template:ro

volumes:
  garage-meta:
  garage-data:
  api-data:
