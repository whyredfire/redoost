<!doctype html>
<!-- The link preview image; render it with
     bunx playwright screenshot --channel chrome --viewport-size 1200,630 og.html public/og.png -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: "Inter Variable";
        font-weight: 100 900;
        src: url("public/fonts/InterVariable.woff2") format("woff2");
      }
      @font-face {
        font-family: "Geist Mono Variable";
        font-weight: 100 900;
        src: url("public/fonts/GeistMonoVariable.woff2") format("woff2");
      }
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        box-sizing: border-box;
        padding: 72px 80px;
        background: #0a0a0a;
        color: #fafafa;
        font-family: "Inter Variable", sans-serif;
        font-feature-settings:
          "calt" 1,
          "ss07" 1,
          "cv11" 1,
          "cv06" 1;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
        font-size: 28px;
        font-weight: 700;
      }
      .mark {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 52px;
        height: 52px;
        border-radius: 13px;
        background: #ebebeb;
        color: #171717;
        font-size: 22px;
      }
      .accent {
        color: #f97c3d;
      }
      h1 {
        margin: 64px 0 0;
        font-size: 92px;
        font-weight: 600;
        line-height: 1;
        letter-spacing: -0.05em;
      }
      h1 span {
        color: #a1a1a1;
      }
      .address {
        display: flex;
        align-items: center;
        gap: 18px;
        margin-top: 56px;
        padding: 22px 28px;
        border: 1.5px solid #ffffff1a;
        border-radius: 18px;
        background: #171717;
        font-family: "Geist Mono Variable", monospace;
        font-size: 28px;
        color: #a1a1a1;
      }
      .address b {
        color: #fafafa;
        font-weight: 500;
      }
      .dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #f97c3d;
        box-shadow: 0 0 0 6px #f97c3d33;
      }
    </style>
  </head>
  <body>
    <div class="brand">
      <span class="mark">r<span class="accent">.</span></span
      >redoost
    </div>
    <h1>Drop a folder.<br /><span>Get an address.</span></h1>
    <div class="address">
      <span class="dot"></span>
      <span>https://<b>brave-otter-1a2b</b>.whyredfire.dpdns.org</span>
    </div>
  </body>
</html>
