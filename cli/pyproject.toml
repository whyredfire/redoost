[project]
name = "redoost"
version = "0.6.2"
description = "Publish static sites to redoost from the command line"
readme = "README.md"
authors = [
    { name = "Karan Parashar", email = "whyredfire@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "httpx2>=2.16.2",
]

[project.scripts]
redoost = "redoost.main:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.13.10"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pyright]
typeCheckingMode = "standard"
