# Stands in for the cluster's ingress during local development

map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

# Published sites
server {
    listen 80;
    server_name *.${REDOOST_SITES_DOMAIN};

    location / {
        proxy_pass http://sites;
        proxy_set_header Host $host;
    }
}

# Browser uploads to S3
server {
    listen 80;
    server_name s3.localhost;
    # Upload limits are enforced by the signed policies
    client_max_body_size 0;

    location / {
        proxy_pass http://garage:3900;
        proxy_set_header Host $host;
        proxy_request_buffering off;
    }
}

# Dashboard and API
server {
    listen 80 default_server;

    location /api/ {
        proxy_pass http://api:8000;
    }

    location / {
        proxy_pass http://frontend:5173;
        # Bun's dev server rejects hosts other than localhost
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
